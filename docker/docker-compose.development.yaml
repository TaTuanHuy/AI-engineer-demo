name: demo-ai

services:
  api:
    container_name: demo-ai-development
    env_file:
      - ../.env
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: development
    ports:
      - "${APP_PORT:-8000}:${APP_PORT:-8000}"
    volumes:
      - ../app:/app/app
    environment:
      APP_ENV: development
      APP_HOST: 0.0.0.0
      APP_RELOAD: "true"
    healthcheck:
      test:
        - CMD-SHELL
        - 'python -c "import os, urllib.request; urllib.request.urlopen(''http://localhost:'' + os.getenv(''APP_PORT'', ''8000'') + ''/health'')"'
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    restart: "no"
