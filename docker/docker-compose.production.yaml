name: demo-ai

services:
  api:
    container_name: demo-ai-production
    env_file:
      - ../.env.production
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: production
    ports:
      - "${APP_PORT:-8000}:${APP_PORT:-8000}"
    healthcheck:
      test:
        - CMD-SHELL
        - "python -c \"import os, urllib.request; urllib.request.urlopen('http://localhost:' + os.getenv('APP_PORT', '8000') + '/health')\""
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

    restart: unless-stopped
